[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "physarum"
version = "0.1.0"
description = "A living data mesh for your body: one SQLite graph that ingests Garmin, meals and notes, then grows insights."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "arczhi" }]
keywords = ["health", "garmin", "sqlite", "data-mesh", "agent", "nutrition"]
dependencies = [
  "garminconnect>=0.3.20",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
phy = "physarum.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/physarum"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
