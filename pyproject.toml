[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bodymesh"
version = "0.1.0"
description = "Every number your body produces, woven into one mesh: a single SQLite graph for Garmin data, meals, weigh-ins and the daily brief that connects them."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "arczhi" }]
keywords = ["health", "garmin", "sqlite", "data-mesh", "agent", "nutrition"]
dependencies = [
  "garminconnect>=0.3.20",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
bm = "bodymesh.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bodymesh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
